# Reference copy of the Compose file `vr init` generates at
# ~/.vegasroom/runtime/compose.yaml (shown for HOME=/home/user, default config).
# Not used at runtime. Design notes live in src/docker/compose_gen.rs.
# Regenerate: VR_UPDATE_REFERENCE_COMPOSE=1 cargo test reference_compose_yaml
services:
  pi:
    build:
      context: .
      dockerfile: harness/pi/Dockerfile
      network: ${VR_PI_BUILD_NETWORK:-host}
      args:
        BASE_IMAGE: ${VR_BASE_IMAGE:-vegasroom/base:latest}
    image: ${VR_PI_IMAGE:-vegasroom/pi:latest}
    user: "0:0"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: ${VR_PI_NETWORK_MODE:-host}
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      HOME: /home/agent
      NPM_CONFIG_CACHE: /home/agent/.cache/npm
      npm_config_cache: /home/agent/.cache/npm
      CARGO_HOME: /home/agent/.cargo
      RUSTUP_HOME: /usr/local/rustup
      PIP_CACHE_DIR: /home/agent/.cache/pip
      GOCACHE: /home/agent/.cache/go-build
      GOMODCACHE: /home/agent/.cache/go-mod
      PI_CODING_AGENT_SESSION_DIR: /home/agent/.pi/sessions
      NPM_CONFIG_PREFIX: /home/agent/.npm-global
      npm_config_prefix: /home/agent/.npm-global
      PATH: /home/agent/.npm-global/bin:/home/agent/.cargo/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      BROWSER: echo
    volumes:
      - type: bind
        source: ${VR_WORKSPACE:-/home/user/.vegasroom/workspace}
        target: /workspace
        read_only: ${VR_WORKSPACE_READ_ONLY:-false}
      - type: bind
        source: /home/user/.vegasroom/harness/pi/config
        target: /home/agent/.pi/agent
      - type: bind
        source: /home/user/.vegasroom/harness/pi/extensions
        target: /home/agent/.pi/extensions
      - type: bind
        source: /home/user/.vegasroom/harness/pi/skills
        target: /home/agent/.pi/skills
      - type: bind
        source: /home/user/.vegasroom/harness/pi/sessions
        target: /home/agent/.pi/sessions
      - type: bind
        source: /home/user/.vegasroom/harness/pi/npm-global
        target: /home/agent/.npm-global
      - type: bind
        source: /home/user/.vegasroom/environment/cargo
        target: /home/agent/.cargo
      - type: bind
        source: /home/user/.vegasroom/ssh
        target: /home/agent/.ssh
      - type: bind
        source: /home/user/.vegasroom/cache
        target: /home/agent/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
  claude:
    build:
      context: .
      dockerfile: harness/claude/Dockerfile
      network: ${VR_CLAUDE_BUILD_NETWORK:-host}
      args:
        BASE_IMAGE: ${VR_BASE_IMAGE:-vegasroom/base:latest}
    image: ${VR_CLAUDE_IMAGE:-vegasroom/claude:latest}
    user: "0:0"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: ${VR_CLAUDE_NETWORK_MODE:-host}
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      HOME: /home/agent
      NPM_CONFIG_CACHE: /home/agent/.cache/npm
      npm_config_cache: /home/agent/.cache/npm
      CARGO_HOME: /home/agent/.cargo
      RUSTUP_HOME: /usr/local/rustup
      PIP_CACHE_DIR: /home/agent/.cache/pip
      GOCACHE: /home/agent/.cache/go-build
      GOMODCACHE: /home/agent/.cache/go-mod
      CLAUDE_CONFIG_DIR: /home/agent/.claude
      DISABLE_AUTOUPDATER: "1"
      PATH: /home/agent/.cargo/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      BROWSER: echo
      ANTHROPIC_API_KEY:
      CLAUDE_CODE_OAUTH_TOKEN:
    volumes:
      - type: bind
        source: ${VR_WORKSPACE:-/home/user/.vegasroom/workspace}
        target: /workspace
        read_only: ${VR_WORKSPACE_READ_ONLY:-false}
      - type: bind
        source: /home/user/.vegasroom/harness/claude/config
        target: /home/agent/.claude
      - type: bind
        source: /home/user/.vegasroom/environment/cargo
        target: /home/agent/.cargo
      - type: bind
        source: /home/user/.vegasroom/ssh
        target: /home/agent/.ssh
      - type: bind
        source: /home/user/.vegasroom/cache
        target: /home/agent/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
